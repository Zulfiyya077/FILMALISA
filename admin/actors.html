<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actors | FILMALISA Admin</title>
    <script>
        (function() {
            const token = sessionStorage.getItem('access_token');
            if (!token) {
                window.location.replace('../auth/adminlogin.html');
            }
        })();
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="admin-page">
        
        <aside class="sidebar">
            <div class="logo-section">
                <img src="../images/Group 89.png" alt="filmalisa" class="logo-image">
            </div>
            
            <nav class="nav-section">
                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="dashboard.html" class="nav-link">
                            <img src="../images/sidebar_dasboard_icon.svg" alt="Dashboard" class="nav-icon">
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./movies.html" class="nav-link">
                            <img src="../images/sidebar_movies_icon.svg" alt="Movies" class="nav-icon">
                            <span>Movies</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./categories.html" class="nav-link">
                            <img src="../images/sidebar_categories_icon.svg" alt="Categories" class="nav-icon">
                            <span>Categories</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./users.html" class="nav-link">
                            <img src="../images/sidebar_user_icon.svg" alt="Users" class="nav-icon">
                            <span>Users</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./comments.html" class="nav-link">
                            <img src="../images/sidebar_comments_icon.svg" alt="Comments" class="nav-icon">
                            <span>Comments</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./actors.html" class="nav-link active">
                            <img src="../images/sidebar_user_icon.svg" alt="Actors" class="nav-icon">
                            <span>Actors</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="contact.html" class="nav-link">
                            <img src="../images/sidebar_contact-us_icon.svg" alt="Contacts" class="nav-icon">
                            <span>Contacts</span>
                        </a>
                    </li>
                </ul>
            </nav>
            
            <div class="logout-section">
                <a href="../auth/adminlogin.html" class="logout-btn" data-role="admin-logout">
                    <img src="../images/sidebar_logout_icon.svg" alt="Logout" class="logout-icon">
                    <span>Logout</span>
                </a>
            </div>
        </aside>
     
        <div class="content-area">
            <header class="header">
                <div class="header-left">
                    <div class="title-section">
                        <span class="greeting">Hi Admin</span>
                        <h1>Actors</h1>
                    </div>
                </div>
                
                <div class="header-right">
                    <button class="create-btn" onclick="openCreateModal()">
                        Create
                    </button>
                    <div class="user-info">
                        <img src="../images/adminavatar.png" alt="Admin">
                        <span>Admin</span>
                    </div>
                </div>
            </header>
            
            <main class="main-content">
                <div class="actors-table-container">
                    <table class="actors-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Surname</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="actorsTableBody">
                            <tr>
                                <td colspan="5" class="text-center">
                                    <div class="loading-spinner">Loading actors...</div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="pagination-container" id="actorsPagination">
                    <!-- Pagination buttons will be generated dynamically -->
                </div>
            </main>
        </div>
    </div>

    <!-- Create/Edit Actor Modal -->
    <div class="modal fade" id="actorModal" tabindex="-1" aria-labelledby="actorModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="actorModalLabel">Create Actor</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="actorForm">
                        <div class="mb-3">
                            <label for="actorName" class="form-label">Name</label>
                            <input type="text" class="form-control" id="actorName" required>
                        </div>
                        <div class="mb-3">
                            <label for="actorSurname" class="form-label">Surname</label>
                            <input type="text" class="form-control" id="actorSurname" required>
                        </div>
                        <div class="mb-3">
                            <label for="actorImage" class="form-label">Image URL</label>
                            <input type="url" class="form-control" id="actorImage" required>
                        </div>
                        <div class="mb-3">
                            <label for="actorPreview" class="form-label">Preview</label>
                            <div class="actor-preview">
                                <img id="actorPreviewImg" src="" alt="Actor Preview" class="preview-image">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveActor">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Actor Modal -->
    <div class="modal fade" id="deleteActorModal" tabindex="-1" aria-labelledby="deleteActorModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteActorModalLabel">Delete Actor</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this actor?</p>
                    <div class="actor-preview">
                        <strong>Actor:</strong> <span id="actor-preview-name"></span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirm-delete-actor">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/actors.js"></script>
    <script src="../js/menu-loader.js"></script>
    <script src="./_auth-guard.js"></script>
    <script>
        ensureAdminAuthenticated();
        setupAdminLogout();
        loadMenuAndFooter({ includeFooter: true });
    </script>
</body>
</html>
