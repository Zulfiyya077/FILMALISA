<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories | FILMALISA Admin</title>
    <script>
        (function() {
            const token = sessionStorage.getItem('access_token');
            if (!token) {
                window.location.replace('../auth/adminlogin.html');
            }
        })();
    </script>
  <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <div class="admin-page">
     
        <aside class="sidebar">
            <div class="logo-section">
                <img src="../images/Group 89.png" alt="filmalisa" class="logo-image">
            </div>
            
            <nav class="nav-section">
                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="dashboard.html" class="nav-link">
                            <img src="../images/sidebar_dasboard_icon.svg" alt="Dashboard" class="nav-icon">
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./movies.html" class="nav-link">
                            <img src="../images/sidebar_movies_icon.svg" alt="Movies" class="nav-icon">
                            <span>Movies</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./categories.html" class="nav-link active">
                            <img src="../images/sidebar_categories_icon.svg" alt="Categories" class="nav-icon">
                            <span>Categories</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./users.html" class="nav-link">
                            <img src="../images/sidebar_user_icon.svg" alt="Users" class="nav-icon">
                            <span>Users</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./comments.html" class="nav-link">
                            <img src="../images/sidebar_comments_icon.svg" alt="Comments" class="nav-icon">
                            <span>Comments</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./actors.html" class="nav-link">
                            <img src="../images/sidebar_user_icon.svg" alt="Actors" class="nav-icon">
                            <span>Actors</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="contact.html" class="nav-link">
                            <img src="../images/sidebar_contact-us_icon.svg" alt="Contacts" class="nav-icon">
                            <span>Contacts</span>
                        </a>
                    </li>
                </ul>
            </nav>
            
     <div class="logout-section">
                <a href="../auth/adminlogin.html" class="logout-btn" data-role="admin-logout">
                    <img src="../images/sidebar_logout_icon.svg" alt="Logout" class="logout-icon">
                    <span>Logout</span>
                </a>
            </div>
        </aside>
     
        <div class="content-area">

                 <header class="header">
                <div class="header-left">
                    <div class="title-section">
                        <span class="greeting">Hi Admin</span>
                        <h1>Categories</h1>
                    </div>
                </div>
                
                <div class="header-right">
                    <button class="create-btn" onclick="openCreateModal()">Create</button>
                    <div class="user-info">
                        <img src="../images/adminavatar.png" alt="Admin">
                        <span>Admin</span>
                    </div>
                </div>
            </header>

            <div class="categories-table-container">
                <table class="categories-table">
                    <thead>
                        <tr>
                            <th style="width: 80px;">ID</th>
                            <th>Name</th>
                            <th style="width: 100px; text-align: center;">Edit</th>
                            <th style="width: 100px; text-align: center;">Delete</th>
                        </tr>
                    </thead>
                    <tbody id="categoriesTableBody">
                        <tr>
                            <td colspan="4" style="text-align: center; padding: 40px;">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination-container" id="categoriesPagination"></div>
        </div>
    </div>

    <!-- Create/Edit Category Modal -->
    <div id="categoryModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="categoryModalLabel">Create Category</h2>
                <button class="modal-close" onclick="closeCategoryModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="modal-body">
                <form id="categoryForm">
                    <div class="form-group">
                        <label for="categoryName">Category Name</label>
                        <input type="text" id="categoryName" placeholder="Enter category name" required>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button class="cancel-btn" onclick="closeCategoryModal()">Cancel</button>
                <button class="submit-btn" onclick="submitCategory()">Submit</button>
            </div>
        </div>
    </div>

    <!-- Delete Category Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content remove-modal">
            <div class="modal-header">
                <h2>Delete Category</h2>
                <button class="modal-close" onclick="closeDeleteModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="modal-body">
                <div class="remove-content">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>Are you sure you want to delete this category?</p>
                    <p class="movie-name" id="deleteCategoryName"></p>
                </div>
            </div>

            <div class="modal-footer">
                <button class="cancel-btn" onclick="closeDeleteModal()">No</button>
                <button class="remove-btn" onclick="confirmDelete()">Yes</button>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../js/categories.js"></script>
    <script src="../js/menu-loader.js"></script>
    <script src="./_auth-guard.js"></script>
    <script>
        ensureAdminAuthenticated();
        setupAdminLogout();
        loadMenuAndFooter({ includeFooter: true });
    </script>
</body>
</html>
