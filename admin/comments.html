<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comments | FILMALISA Admin</title>
    <script>
        (function() {
            const token = sessionStorage.getItem('access_token');
            if (!token) {
                window.location.replace('../auth/adminlogin.html');
            }
        })();
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="admin-page">
          <aside class="sidebar">
            <div class="logo-section">
                <img src="../images/Group 89.png" alt="filmalisa" class="logo-image">
            </div>
            
            <nav class="nav-section">
                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="dashboard.html" class="nav-link">
                            <img src="../images/sidebar_dasboard_icon.svg" alt="Dashboard" class="nav-icon">
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./movies.html" class="nav-link">
                            <img src="../images/sidebar_movies_icon.svg" alt="Movies" class="nav-icon">
                            <span>Movies</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./categories.html" class="nav-link">
                            <img src="../images/sidebar_categories_icon.svg" alt="Categories" class="nav-icon">
                            <span>Categories</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./users.html" class="nav-link">
                            <img src="../images/sidebar_user_icon.svg" alt="Users" class="nav-icon">
                            <span>Users</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./comments.html" class="nav-link active">
                            <img src="../images/sidebar_comments_icon.svg" alt="Comments" class="nav-icon">
                            <span>Comments</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./actors.html" class="nav-link">
                            <img src="../images/sidebar_user_icon.svg" alt="Actors" class="nav-icon">
                            <span>Actors</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="contact.html" class="nav-link">
                            <img src="../images/sidebar_contact-us_icon.svg" alt="Contacts" class="nav-icon">
                            <span>Contacts</span>
                        </a>
                    </li>
                </ul>
            </nav>
            
            <div class="logout-section">
                <a href="../auth/adminlogin.html" class="logout-btn" data-role="admin-logout">
                    <img src="../images/sidebar_logout_icon.svg" alt="Logout" class="logout-icon">
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <div class="content-area">
               <header class="header">
                <div class="header-left">
                    <div class="title-section">
                        <span class="greeting">Hi Admin</span>
                        <h1>Comments</h1>
                    </div>
                </div>
                
                <div class="header-right">
                    <div class="user-info">
                        <img src="../images/adminavatar.png" alt="Admin">
                        <span>Admin</span>
                    </div>
                </div>
            </header>
            
            <main class="main-content">

            <div class="comments-table-container">
                <table class="comments-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Film</th>
                            <th>Comment</th>
                            <th>View</th>
                            <th>Remove</th>
                        </tr>
                    </thead>
                    <tbody id="commentsTableBody">
                        <tr>
                            <td colspan="7" class="text-center">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination-container" id="commentsPagination">
            </div>
            </main>
        </div>
    </div>

    <!-- View Comment Modal -->
    <div class="modal fade" id="viewModal" tabindex="-1" aria-labelledby="viewModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="viewModalLabel">Comment</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="viewCommentText" style="font-size: 14px;  line-height: 1.6; white-space: pre-wrap; margin: 0;"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Comment Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteModalLabel">Delete Comment</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this comment? This action cannot be undone.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../js/comments.js"></script>
    <script src="../js/menu-loader.js"></script>
    <script src="./_auth-guard.js"></script>
    <script>
        ensureAdminAuthenticated();
        setupAdminLogout();
        loadMenuAndFooter({ includeFooter: true });
    </script>
</body>
</html>
