<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts | FILMALISA Admin</title>
    <script>
        (function() {
            const token = sessionStorage.getItem('access_token');
            const userType = sessionStorage.getItem('user_type');
            if (!token || userType !== 'admin') {
                window.location.replace('../auth/adminlogin.html');
            }
        })();
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <div class="admin-page">
     
        <aside class="sidebar">
            <div class="logo-section">
                <img src="../images/Group 89.png" alt="filmalisa" class="logo-image">
            </div>
            
            <nav class="nav-section">
                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="dashboard.html" class="nav-link">
                            <img src="../images/sidebar_dasboard_icon.svg" alt="Dashboard" class="nav-icon">
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./movies.html" class="nav-link">
                            <img src="../images/sidebar_movies_icon.svg" alt="Movies" class="nav-icon">
                            <span>Movies</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./categories.html" class="nav-link">
                            <img src="../images/sidebar_categories_icon.svg" alt="Categories" class="nav-icon">
                            <span>Categories</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./users.html" class="nav-link">
                            <img src="../images/sidebar_user_icon.svg" alt="Users" class="nav-icon">
                            <span>Users</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./comments.html" class="nav-link">
                            <img src="../images/sidebar_comments_icon.svg" alt="Comments" class="nav-icon">
                            <span>Comments</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./actors.html" class="nav-link">
                            <img src="../images/sidebar_user_icon.svg" alt="Actors" class="nav-icon">
                            <span>Actors</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="contact.html" class="nav-link active">
                            <img src="../images/sidebar_contact-us_icon.svg" alt="Contacts" class="nav-icon">
                            <span>Contacts</span>
                        </a>
                    </li>
                </ul>
            </nav>
            
           <div class="logout-section">
                <a href="../auth/adminlogin.html" class="logout-btn" data-role="admin-logout">
                    <img src="../images/sidebar_logout_icon.svg" alt="Logout" class="logout-icon">
                    <span>Logout</span>
                </a>
            </div>
        </aside>
     
        <div class="content-area">
            <header class="header">
                <div class="header-left">
                    <div class="title-section">
                        <span class="greeting">Hi Admin</span>
                        <h1>Contacts</h1>
                    </div>
                </div>
                
                <div class="header-right">
                    <div class="user-info">
                        <img src="../images/adminavatar.png" alt="Admin">
                        <span>Admin</span>
                    </div>
                </div>
            </header>
            
            <div class="contacts-table-container">
                <table class="contacts-table">
                    <thead>
                        <tr>
                            <th style="width: 80px;">ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Reason</th>
                            <th style="width: 120px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="contactsTableBody">
                        <tr>
                            <td colspan="5" class="text-center">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination-container" id="contactsPagination"></div>
        </div>
    </div>

    <!-- Delete Contact Modal -->
    <div class="modal" id="deleteContactModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content remove-modal">
                <div class="modal-header">
                    <h5 class="modal-title">Delete Contact</h5>
                    <button type="button" class="modal-close" data-bs-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body remove-content">
                    <p>Are you sure you want to delete this contact message?</p>
                    <div style="margin-top: 15px; padding: 10px; background: #2a2a2a; border-radius: 6px;">
                        <p style="margin: 5px 0; font-size: 13px;"><strong>From:</strong> <span id="contact-preview-name"></span></p>
                        <p style="margin: 5px 0; font-size: 13px;"><strong>Message:</strong> <span id="subject-preview-text"></span></p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="cancel-btn" data-bs-dismiss="modal">No</button>
                    <button type="button" class="remove-btn" id="confirm-delete-contact">Yes</button>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../js/contacts.js"></script>
    <script src="../js/menu-loader.js"></script>
    <script src="./_auth-guard.js"></script>
    <script>
        ensureAdminAuthenticated();
        setupAdminLogout();
        loadMenuAndFooter({ includeFooter: true });
    </script>
</body>
</html>
