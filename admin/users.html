<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users | FILMALISA Admin</title>
    <script>
        (function() {
            const token = sessionStorage.getItem('access_token');
            const userType = sessionStorage.getItem('user_type');
            if (!token || userType !== 'admin') {
                window.location.replace('../auth/adminlogin.html');
            }
        })();
    </script>
  <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="admin-page">
     
        <aside class="sidebar">
            <div class="logo-section">
                <img src="../images/Group 89.png" alt="filmalisa" class="logo-image">
            </div>
            
            <nav class="nav-section">
                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="dashboard.html" class="nav-link">
                            <img src="../images/sidebar_dasboard_icon.svg" alt="Dashboard" class="nav-icon">
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./movies.html" class="nav-link">
                            <img src="../images/sidebar_movies_icon.svg" alt="Movies" class="nav-icon">
                            <span>Movies</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./categories.html" class="nav-link">
                            <img src="../images/sidebar_categories_icon.svg" alt="Categories" class="nav-icon">
                            <span>Categories</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./users.html" class="nav-link active">
                            <img src="../images/sidebar_user_icon.svg" alt="Users" class="nav-icon">
                            <span>Users</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./comments.html" class="nav-link">
                            <img src="../images/sidebar_comments_icon.svg" alt="Comments" class="nav-icon">
                            <span>Comments</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./actors.html" class="nav-link">
                            <img src="../images/sidebar_user_icon.svg" alt="Actors" class="nav-icon">
                            <span>Actors</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="contact.html" class="nav-link">
                            <img src="../images/sidebar_contact-us_icon.svg" alt="Contacts" class="nav-icon">
                            <span>Contacts</span>
                        </a>
                    </li>
                </ul>
            </nav>
            
            <div class="logout-section">
                <a href="../auth/adminlogin.html" class="logout-btn" data-role="admin-logout">
                    <img src="../images/sidebar_logout_icon.svg" alt="Logout" class="logout-icon">
                    <span>Logout</span>
                </a>
            </div>
        </aside>
     
        <div class="content-area">
            <header class="header">
                <div class="header-left">
                    <div class="title-section">
                        <span class="greeting">Hi Admin</span>
                        <h1>Users</h1>
                    </div>
                </div>
                
                <div class="header-right">
                    <div class="user-info">
                        <img src="../images/adminavatar.png" alt="Admin">
                        <span>Admin</span>
                    </div>
                </div>
            </header>
            
            <main class="main-content">
                <div class="users-table-container">
                    <table class="users-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>User</th>
                                <th>Email</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr>
                                <td colspan="3" style="text-align: center; padding: 40px; background: white;">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="pagination-container" id="usersPagination"></div>
            </main>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../js/users.js"></script>
    <script src="../js/menu-loader.js"></script>
    <script src="./_auth-guard.js"></script>
    <script>
        ensureAdminAuthenticated();
        setupAdminLogout();
        loadMenuAndFooter({ includeFooter: true });
    </script>
</body>
</html>
