<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filmalisa Login</title>
    <link rel="stylesheet" href="../css/clientlogin.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <img
          src="../assets/images/728dbadd7dad4c8f1455e46acab13802b64bef68.png"
          alt="Filmalisa Logo"
          class="logo-img"
        />
        <h1>filmalisa</h1>
        <p class="subtitle">login</p>
      </div>

      <form class="login-form">
        <div class="input-group">
          <img
            src="../assets/icons/lefticon1.svg"
            alt="email icon"
            class="icon-img"
          />
          <input type="email" id="loginEmail" placeholder="email" required />
        </div>

        <div class="input-group">
          <img
            src="../assets/icons/lefticon2.svg"
            alt="lock icon"
            class="icon-img"
          />
          <input type="password" id="loginPassword" placeholder="password" required />
          <img
            src="../assets/icons/righticon.svg"
            alt="eye icon"
            class="icon-img-right"
          />
        </div>

        <a href="clientregister.html" class="register-link">Register here</a>

        <button type="submit" class="login-btn">login</button>
      </form>
    </div>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
