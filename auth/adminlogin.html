<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>
    <link rel="stylesheet" href="../css/adminlogin.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Numans&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="login-container">
      <img
        src="../assets/images/728dbadd7dad4c8f1455e46acab13802b64bef68.png"
        alt="Admin Logo"
        class="logo"
      />
      <h1 class="login-title">Admin</h1>
      <form>
        <div class="input-group">
          <img
            src="../assets/icons/lefticon1.svg"
            class="icon-left"
            alt="icon"
          />
          <input type="text" id="adminUsername" placeholder="username" required />
        </div>

        <div class="input-group">
          <img
            src="../assets/icons/lefticon2.svg"
            class="icon-left"
            alt="icon"
          />
          <input type="password" id="adminPassword" placeholder="password" required />
          <img
            src="../assets/icons/righticon.svg"
            class="icon-right"
            alt="icon"
          />
        </div>

        <button type="submit">login</button>
      </form>
    </div>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../admin/_auth-guard.js"></script>
    <script src="../js/adminlogin.js"></script>
    <script>
      redirectIfAdminAuthenticated();
    </script>
  </body>
</html>
