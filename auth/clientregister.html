<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Filmalisa</title>
    <link rel="stylesheet" href="../theme/reset.css" />
    <link rel="stylesheet" href="../css/clientregister.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
  </head>
  <body>
    <div class="container">
      <div class="content">
        <div class="logo-container">
          <img
            src="../assets/images/728dbadd7dad4c8f1455e46acab13802b64bef68.png"
            alt="filmalisa logo"
            class="logo"
          />
          <h1>filmalisa</h1>
          <h2>register</h2>
        </div>

        <form>
          <div class="input-box">
            <img
              src="../assets/icons/lefticon2.svg"
              class="icon-left"
              alt="icon"
            />
            <input type="text" id="registerName" placeholder="Full name" required />
            <img
              src="../assets/icons/righticon.svg"
              class="icon-right"
              alt="icon"
            />
          </div>

          <div class="input-box">
            <img
              src="../assets/icons/lefticon1.svg"
              class="icon-left"
              alt="icon"
            />
            <input type="email" id="registerEmail" placeholder="Email" required />
          </div>

          <div class="input-box">
            <img
              src="../assets/icons/lefticon2.svg"
              class="icon-left"
              alt="icon"
            />
            <input type="password" id="registerPassword" placeholder="Password" required />
            <img
              src="../assets/icons/righticon.svg"
              class="icon-right"
              alt="icon"
            />
          </div>

          <p class="bottom-text">
            Do you have an account?
            <a href="Clientlogin.html">Login here</a>
          </p>

          <button type="submit" class="btn">Register</button>
        </form>
      </div>
    </div>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
