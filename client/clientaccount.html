<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Profile - Filmalisa</title>
    <link rel="stylesheet" href="../css/clientaccount.css" />
  </head>
  <body>
    <div class="container">
      <div class="content">
        <div class="profile-photo">
          <img src="../assets/images/1651258516656 1.png" alt="Profile Image" />
        </div>

        <form>
          <div class="input-box">
            <img
              src="../assets/icons/lefticon2.svg"
              class="icon-left"
              alt="icon"
            />
            <input type="text" placeholder="profile image url" />
            <img
              src="../assets/icons/righticon.svg"
              class="icon-right"
              alt="icon"
            />
          </div>

          <div class="input-box">
            <img
              src="../assets/icons/lefticon2.svg"
              class="icon-left"
              alt="icon"
            />
            <input type="text" placeholder="full name" />
            <img
              src="../assets/icons/righticon.svg"
              class="icon-right"
              alt="icon"
            />
          </div>

          <div class="input-box">
            <img
              src="../assets/icons/lefticon1.svg"
              class="icon-left"
              alt="icon"
            />
            <input
              type="email"
              placeholder="email"
              value="rahimlisarkhan@gmail.com"
            />
          </div>

          <div class="input-box">
            <img
              src="../assets/icons/lefticon2.svg"
              class="icon-left"
              alt="icon"
            />
            <input type="password" placeholder="password" />
            <img
              src="../assets/icons/righticon.svg"
              class="icon-right"
              alt="icon"
            />
          </div>

          <button type="submit" class="btn">Save</button>
        </form>
      </div>
    </div>
  </body>
</html>
