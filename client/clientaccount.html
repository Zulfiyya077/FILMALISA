<!DOCTYPE html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Client Account | FILMALISA</title>
    <script src="../js/client-guard.js"></script>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/menu.css" />
    <link rel="stylesheet" href="../css/landing.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="stylesheet" href="../css/clientaccount.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
  </head>
  <body>
    <div id="menu-container"></div>

    <div class="page-container">
      <main class="main-content">
        <div class="account-container">
        <section class="profile-card">
          <div class="profile-photo">
            <img
              src=""
              alt="Profile image"
              id="profileImagePreview"
            />
          </div>
          <div style="text-align: center;">
            <h1 class="profile-title">Account Information</h1>
            <p class="profile-subtitle">
              Update your personal details and keep your account secure.
            </p>
          </div>

          <form class="profile-form" id="profileForm" novalidate>
            <div class="profile-input">
              <img
                src="../assets/icons/lefticon2.svg"
                alt="icon"
                class="icon-left"
              />
              <input
                type="url"
                id="profileImage"
                placeholder="Profile image URL"
                autocomplete="off"
              />
              <img
                src="../assets/icons/righticon.svg"
                alt="icon"
                class="icon-right"
                id="profileImageClear"
              />
            </div>

            <div class="profile-input">
              <img
                src="../assets/icons/lefticon2.svg"
                alt="icon"
                class="icon-left"
              />
              <input
                type="text"
                id="fullName"
                placeholder="Full name"
                autocomplete="name"
                required
              />
              <img
                src="../assets/icons/righticon.svg"
                alt="icon"
                class="icon-right"
                style="opacity: 0.4; cursor: default;"
              />
            </div>

            <div class="profile-input">
              <img
                src="../assets/icons/lefticon1.svg"
                alt="icon"
                class="icon-left"
              />
              <input
                type="email"
                id="email"
                placeholder="Email"
                autocomplete="email"
                readonly
              />
              <img
                src="../assets/icons/righticon.svg"
                alt="icon"
                class="icon-right"
                style="opacity: 0.4; cursor: default;"
              />
            </div>

            <div class="profile-input">
              <img
                src="../assets/icons/lefticon2.svg"
                alt="icon"
                class="icon-left"
              />
              <input
                type="password"
                id="password"
                placeholder="New password (optional)"
                autocomplete="new-password"
              />
              <img
                src="../assets/icons/righticon.svg"
                alt="Toggle password visibility"
                class="icon-right"
                id="togglePasswordVisibility"
              />
            </div>

            <p class="profile-hint">
              Password should contain at least 6 characters. When you enter an image URL,
              the preview updates automatically.
            </p>

            <div class="profile-actions">
              <button type="submit" class="profile-submit">Yadda saxla</button>
              <button type="button" class="profile-submit profile-reset" id="profileReset">
                Reset changes
              </button>
            </div>
          </form>
        </section>
        </div>
      </main>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../js/menu-loader.js"></script>
    <script>
      const showToast = (message, type = 'success') => {
        Toastify({
          text: message,
          duration: 2500,
          gravity: 'top',
          position: 'right',
          style: {
            background: type === 'success' ? '#27ae60' : '#e74c3c'
          }
        }).showToast();
      };

      const AVATAR_BASE_URL = 'https://api.dicebear.com/7.x/initials/svg?backgroundColor=58209d,241f36&radius=50&seed=';

      const generateAvatarUrl = (name, email) => {
        const seed = (name && name.trim()) || (email && email.trim()) || 'FILMALISA User';
        return `${AVATAR_BASE_URL}${encodeURIComponent(seed)}`;
      };

      window.addEventListener('DOMContentLoaded', () => {
        loadMenuAndFooter({ activePage: 'clientaccount', includeFooter: true });
      });

      document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('profileForm');
        const imageInput = document.getElementById('profileImage');
        const fullNameInput = document.getElementById('fullName');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const previewImage = document.getElementById('profileImagePreview');
        const resetButton = document.getElementById('profileReset');
        const clearImageButton = document.getElementById('profileImageClear');
        const togglePassword = document.getElementById('togglePasswordVisibility');

        const getFallbackAvatar = (name, email) => generateAvatarUrl(name || fullNameInput.value, email || emailInput.value);

        const storedUserRaw = sessionStorage.getItem('user_data');
        if (storedUserRaw) {
          try {
            const storedUser = JSON.parse(storedUserRaw);
            if (storedUser.full_name) fullNameInput.value = storedUser.full_name;
            if (storedUser.email) emailInput.value = storedUser.email;
            const resolvedImage = (storedUser.img_url && storedUser.img_url.trim()) || generateAvatarUrl(storedUser.full_name, storedUser.email);
            imageInput.value = resolvedImage;
            previewImage.src = resolvedImage;
            storedUser.img_url = resolvedImage;
            sessionStorage.setItem('user_data', JSON.stringify(storedUser));
          } catch (error) {
            console.warn('Unable to read user data:', error);
          }
        }

        const updatePreview = (value) => {
          const fallback = generateAvatarUrl(fullNameInput.value, emailInput.value);
          const finalValue = value && value.trim() ? value.trim() : fallback;
          previewImage.src = finalValue;
          previewImage.onerror = function () {
            previewImage.onerror = null;
            previewImage.src = fallback;
          };
        };

        imageInput.addEventListener('input', (event) => {
          updatePreview(event.target.value.trim());
        });

        clearImageButton.addEventListener('click', () => {
          imageInput.value = '';
          updatePreview('');
        });

        fullNameInput.addEventListener('input', () => {
          if (!imageInput.value.trim()) {
            updatePreview('');
          }
        });

        emailInput.addEventListener('input', () => {
          if (!imageInput.value.trim()) {
            updatePreview('');
          }
        });

        togglePassword.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        });

        resetButton.addEventListener('click', () => {
          const storedUserRawInner = sessionStorage.getItem('user_data');
          if (storedUserRawInner) {
            try {
              const storedUser = JSON.parse(storedUserRawInner);
              fullNameInput.value = storedUser.full_name || '';
              emailInput.value = storedUser.email || '';
              const resolvedImage = (storedUser.img_url && storedUser.img_url.trim()) || generateAvatarUrl(storedUser.full_name, storedUser.email);
              imageInput.value = resolvedImage;
              updatePreview(resolvedImage);
              passwordInput.value = '';
              if (window.updateSidebarAvatar) {
                window.updateSidebarAvatar(resolvedImage);
              }
              showToast('Changes have been reset.', 'success');
              return;
            } catch (error) {
              console.warn('User data reset failed:', error);
            }
          }

          fullNameInput.value = '';
          imageInput.value = '';
          updatePreview('');
          passwordInput.value = '';
          if (window.updateSidebarAvatar) {
            window.updateSidebarAvatar(generateAvatarUrl('', emailInput.value));
          }
          showToast('Form reset.', 'success');
        });

        form.addEventListener('submit', (event) => {
          event.preventDefault();

          const fullName = fullNameInput.value.trim();
          const email = emailInput.value.trim();
          const imageUrl = imageInput.value.trim();
          const password = passwordInput.value.trim();

          if (!fullName || fullName.length < 2) {
            showToast('Full name must contain at least 2 characters.', 'error');
            fullNameInput.focus();
            return;
          }

          if (password && password.length < 6) {
            showToast('Password must contain at least 6 characters.', 'error');
            passwordInput.focus();
            return;
          }

          const finalImageUrl = imageUrl || generateAvatarUrl(fullName, email);

          const storedUser = {
            full_name: fullName,
            email,
            img_url: finalImageUrl
          };

          sessionStorage.setItem('user_data', JSON.stringify(storedUser));

          if (password) {
            sessionStorage.setItem('profile_temp_password', password);
          }

          if (window.updateSidebarAvatar) {
            window.updateSidebarAvatar(finalImageUrl);
          }

          updatePreview(finalImageUrl);
          showToast('Profile information saved.', 'success');
        });
      });
    </script>
  </body>
</html>
