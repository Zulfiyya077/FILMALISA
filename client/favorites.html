<!DOCTYPE html>
<html lang="az">
<head>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/favorites.css">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <div class="page-container">
        <!-- Sidebar Menu -->
        <aside class="sidebar-menu">
            <div class="sidebar-logo">
                <img src="../images/Animate2.svg" alt="FILMALISA" class="logo-image">
            </div>
            
            <nav class="sidebar-nav">
                <a href="home.html" class="sidebar-item">
                    <img src="../images/Icon button.svg" alt="Home" class="sidebar-icon">
                </a>
                
                <a href="search.html" class="sidebar-item">
                    <img src="../images/Icon button (1).svg" alt="Search" class="sidebar-icon">
                </a>

        <main class="main-content">
            <div class="favorites-container">
                <div class="favorites-header">
                    <h1 class="favorites-title">Favorite movies</h1>
