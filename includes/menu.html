<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Component | FILMALISA</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Sidebar Menu Component -->
    <aside class="sidebar-menu">
        <div class="sidebar-logo">
            <img src="../images/Animate2.svg" alt="FILMALISA" class="logo-image">
        </div>
        
        <nav class="sidebar-nav">
            <a href="../client/home.html" class="sidebar-item active" data-page="home">
                <img src="../images/Icon button.svg" alt="Home" class="sidebar-icon">
            </a>
            
            <a href="../client/search.html" class="sidebar-item" data-page="search">
                <img src="../images/Icon button (1).svg" alt="Search" class="sidebar-icon">
            </a>
            
            <a href="../client/clientaccount.html" class="sidebar-item" data-page="clientaccount">
                <img src="../images/Icon button (2).svg" alt="Profile" class="sidebar-icon">
            </a>
            
            <a href="../client/favorites.html" class="sidebar-item" data-page="favorites">
                <img src="../images/Icon button (3).svg" alt="Favorites" class="sidebar-icon">
            </a>
            
        </nav>

        <div class="sidebar-profile">
            <img
                src="../assets/images/1651258516656 1.png"
                alt="User avatar"
                class="sidebar-avatar"
                data-role="sidebar-avatar"
            >
        </div>
    </aside>
</body>
</html>
